services:
  redis:
    image: redis:7-alpine
    container_name: kyung-redis
    restart: unless-stopped
    ports:
      # Host port: set REDIS_PORT in .env (default 6379). Use 6380 if 6379 is already allocated.
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: kyung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyung_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kyung_db}
    ports:
      # Host port: set POSTGRES_PORT in .env (default 5432). Use 5433 if 5432 is already allocated.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyung} -d ${POSTGRES_DB:-kyung_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
