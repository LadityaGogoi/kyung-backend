services:
  postgres:
    image: postgres:16-alpine
    container_name: kyung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyung_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kyung_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyung} -d ${POSTGRES_DB:-kyung_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
